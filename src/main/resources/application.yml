spring:
  application:
    name: climb-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:25MB}
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: ${HIBERNATE_BATCH_FETCH_SIZE:50}
        query.in_clause_parameter_padding: true
        jdbc.batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:25}
        order_inserts: true
        order_updates: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/problem+json,text/html,text/plain,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${APP_MAIL_FROM:no-reply@climbe.com}
    from-name: ${APP_MAIL_FROM_NAME:Climbe}
    reply-to: ${APP_MAIL_REPLY_TO:}
  reports:
    output-dir: ${REPORTS_OUTPUT_DIR:uploads/relatorios}
  contract-storage:
    directory: ${CONTRACT_STORAGE_DIRECTORY:uploads/contratos}
  cloudflare-r2:
    endpoint: ${CLOUDFLARE_R2_ENDPOINT:}
    access-key: ${CLOUDFLARE_R2_ACCESS_KEY:}
    secret-key: ${CLOUDFLARE_R2_SECRET_KEY:}
    bucket: ${CLOUDFLARE_R2_BUCKET:}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL:}
    region: ${CLOUDFLARE_R2_REGION:auto}
  contract-notifications:
    expiration-warning-days: ${CONTRACT_EXPIRATION_WARNING_DAYS:30}
    expiration-cron: "${CONTRACT_EXPIRATION_CRON:0 0 8 * * *}"
  document-review:
    expiration-days: ${DOCUMENT_REVIEW_EXPIRATION_DAYS:30}
  zapsign:
    api-url: ${ZAPSIGN_API_URL:https://api.zapsign.com.br}
    api-token: ${API_ZAPSIGN:}
    signing-url: ${ZAPSIGN_SIGNING_URL:https://app.zapsign.com.br/verificar}
    webhook-secret: ${ZAPSIGN_WEBHOOK_SECRET:}
    sandbox: ${ZAPSIGN_SANDBOX:false}
  pipeline:
    task-reminders:
      zone: ${PIPELINE_TASK_REMINDER_ZONE:America/Sao_Paulo}
      weekly-cron: "${PIPELINE_TASK_WEEKLY_REMINDER_CRON:0 0 8 * * *}"
      overdue-cron: "${PIPELINE_TASK_OVERDUE_REMINDER_CRON:0 10 8 * * *}"

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production-minimum-256-bits-long}
  expiration:
    access-token: ${JWT_ACCESS_TOKEN_EXPIRATION:7200000}
    refresh-token: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
    pending-token: ${JWT_PENDING_TOKEN_EXPIRATION:1800000}
  issuer: climb-api

google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:}
    frontend-url: ${GOOGLE_CALENDAR_FRONTEND_URL:http://localhost:5173}
    allowed-domain: ${GOOGLE_CALENDAR_ALLOWED_DOMAIN:@climbe.com.br}
